{{- define "main" }}

<article class="post-single" id="bookmarks-page">
  <header class="post-header">
    <h1 class="post-title">
      {{ .Title }}
    </h1>
    {{- if .Description }}
    <div class="post-description">
      {{ .Description }}
    </div>
    {{- end }}
  </header>

  <div class="post-content">
    {{- if .Content }}
    {{ .Content }}
    {{- end }}

    <div id="bookmarks-list">
      <p>Loading bookmarks...</p>
    </div>
  </div>
</article>

<style>
#bookmarks-list {
  margin-top: 2rem;
}

.bookmark-item {
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  transition: border-color 0.2s;
}

.bookmark-item:hover {
  border-color: var(--primary);
}

.bookmark-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
}

.bookmark-header h3 {
  margin: 0;
  font-size: 1.25rem;
  flex: 1;
}

.bookmark-header h3 a {
  color: var(--primary);
  text-decoration: none;
}

.bookmark-header h3 a:hover {
  text-decoration: underline;
}

.delete-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--content);
  cursor: pointer;
  font-size: 24px;
  line-height: 1;
  padding: 4px 10px;
  transition: all 0.2s;
}

.delete-btn:hover {
  background: #ff6b6b;
  border-color: #ff6b6b;
  color: white;
}

.bookmark-meta {
  margin-top: 0.5rem;
  font-size: 0.875rem;
  color: var(--secondary);
}

.bookmark-notes {
  margin-top: 1rem;
}

.bookmark-notes textarea {
  width: 100%;
  min-height: 80px;
  padding: 0.75rem;
  background: var(--theme);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--content);
  font-family: inherit;
  font-size: 0.875rem;
  resize: vertical;
  transition: border-color 0.2s;
}

.bookmark-notes textarea:focus {
  outline: none;
  border-color: var(--primary);
}

.bookmark-notes textarea::placeholder {
  color: var(--secondary);
}

.no-bookmarks {
  text-align: center;
  color: var(--secondary);
  padding: 3rem 1rem;
}

.error {
  color: #ff6b6b;
  text-align: center;
  padding: 2rem 1rem;
}
</style>

{{- end }}{{/* end main */}}
